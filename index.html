<title>Dodge Grid</title>
<style>
  :root {
    --bg: #1a1a1a; --paper: #f8f9fa; --ink: #222; --overlay: rgba(255,255,255,0.94);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overscroll-behavior: none; touch-action: none; }
  html { background: #1a1a1a; min-height: 100vh; min-height: 100dvh; }
  body { position: fixed !important; inset: 0; height: auto !important; width: 100%; }
  html.ui, html.ui body { touch-action: manipulation; }
  body { background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; position: relative; touch-action: none; }
  #fps { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 8px; font-size: 11px; color: rgba(255,255,255,0.7); font-family: monospace; z-index: 20; pointer-events: none; }
  #bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; pointer-events: none; }
  #ui { font-size: 28px; font-weight: bold; color: #f8f9fa; }
  #best { font-size: 18px; font-weight: bold; color: #f2c14e; }
  #hint { font-size: 13px; color: #999; margin-top: 12px; pointer-events: none; }
  canvas { background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); touch-action: none; }
  #gameover { position: absolute; display: none; flex-direction: column; align-items: center; background: var(--overlay); color: var(--ink); padding: 26px 18px; width: min(72%, 250px); text-align: center; border: 3px solid var(--ink); border-radius: 12px; z-index: 3; }
  #newrec { display: inline-block; margin-top: 2px; font-size: 22px; font-weight: 800; color: #e6a800; -webkit-text-stroke: 0.6px #9a6200; paint-order: stroke fill; letter-spacing: 0; animation: recBlink 0.9s ease-in-out infinite alternate; }
  @keyframes recBlink { from { color: #c98a00; opacity: 0.55; } to { color: #ffd21f; opacity: 1; } }
  button { margin-top: 15px; padding: 10px 25px; font-size: 18px; font-weight: bold; background: var(--ink); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:active { transform: scale(0.95); }
  .screen { position: fixed; inset: 0; background: #1a1a1a; color: #f8f9fa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); text-align: center; }
  .screen.hidden { display: none; }
  .screen button { margin-top: 0; min-width: 200px; background: #f8f9fa; color: #222; }
  .title { margin-bottom: 14px; }
  .title .g { display: block; position: relative; }
  .title .lt { display: block; overflow: visible; }
  .title .gy { filter: drop-shadow(0 0 8px rgba(252,238,10,0.6)) drop-shadow(0 0 22px rgba(252,238,10,0.25)); }
  .title .gc { filter: drop-shadow(0 0 8px rgba(0,240,255,0.6)) drop-shadow(0 0 22px rgba(0,240,255,0.25)); }
  .title .gA { animation: glitchA 3.2s infinite steps(1); }
  .title .gB { animation: glitchB 3.2s infinite steps(1); }
  @keyframes glitchA { 0%,90%,100% { opacity: 0; } 92% { opacity: 1; transform: translate(-9px,0); } 95% { opacity: 1; transform: translate(7px,0); } }
  @keyframes glitchB { 0%,86%,100% { opacity: 0; } 88% { opacity: 1; transform: translate(9px,0); } 93% { opacity: 1; transform: translate(-7px,0); } }
  .title .g:last-child { margin-left: 100px; margin-top: -12px; }
  .title .man { position: absolute; right: 100%; bottom: 5px; width: 103px; height: 100px; z-index: -1; margin-right: -8px; }
  .title .mv, .title .aL, .title .aR, .title .lL, .title .lR { transform-origin: 0 0; animation: 3.2s infinite; }
  .title .mv { animation-name: stepBody; }
  .title .aL { transform-origin: 0 1px; animation-name: stepArmL; }
  .title .aR { transform-origin: 0 1px; animation-name: stepArmR; }
  .title .lL { transform-origin: 0 8px; animation-name: stepLegL; }
  .title .lR { transform-origin: 0 8px; animation-name: stepLegR; }
  @keyframes stepBody { 0%,8% { transform: none; } 12% { transform: translate(14px,1px) rotate(8deg); } 28%,50% { transform: translate(14px,0) rotate(0deg); } 54% { transform: translate(0,1px) rotate(-8deg); } 72%,100% { transform: none; } }
  @keyframes stepArmL { 0%,8% { transform: none; } 12%,22% { transform: rotate(-135deg); } 28%,100% { transform: none; } }
  @keyframes stepArmR { 0%,50% { transform: none; } 54%,64% { transform: rotate(135deg); } 70%,100% { transform: none; } }
  @keyframes stepLegR { 0%,8% { d: path("M0 8L5 18"); } 12%,22% { d: path("M0 8L8 12L13 18"); } 28%,100% { d: path("M0 8L5 18"); } }
  @keyframes stepLegL { 0%,50% { d: path("M0 8L-5 18"); } 54%,64% { d: path("M0 8L-8 12L-13 18"); } 70%,100% { d: path("M0 8L-5 18"); } }




  #menu-best { display: none; }
  .screen button small { display: block; font-size: 12px; font-weight: normal; opacity: 0.7; margin-top: 3px; }
  #lvgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(100%, 440px, calc(100dvh - 250px)); }
  .screen button.lvcard { position: relative; aspect-ratio: 1; min-width: 0; width: 100%; padding: 0; border: 3px solid rgba(248,249,250,0.9); border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 6px 16px rgba(0,0,0,0.5); transition: transform 0.12s; }
  .screen button.lvcard:active { transform: scale(0.96); }
  .lvcard canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .lvname { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 6px 12px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: #fff; font-size: 25px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  .screen button.back { background: #666; color: #fff; }
  #home { background: #666; margin-left: 8px; }
  #pause { pointer-events: auto; display: none; align-items: center; justify-content: center; gap: 5px; width: 42px; height: 36px; margin: 0; padding: 0; background: rgba(255,255,255,0.16); border-radius: 8px; }
  #pause span { display: block; width: 5px; height: 16px; background: #f8f9fa; border-radius: 2px; }
  .vol { display: flex; align-items: center; gap: 10px; width: min(320px, 100%); font-size: 17px; }
  .vol label { width: 40px; text-align: left; }
  .vol input[type=range] { flex: 1; accent-color: #f2c14e; height: 32px; }
  .vol span { width: 40px; text-align: right; color: #f2c14e; font-size: 15px; }
  #transition { position: fixed; inset: 0; z-index: 50; display: none; }
  #transition.on { display: block; }
  #transition .tbg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #1b2a44, #070a10 70%); opacity: 0; transition: opacity 0.25s; }
  #transition.close .tbg { opacity: 1; }
  #transition.open .tbg { opacity: 0; transition: opacity 0.5s; }
  #transition .pillar { position: absolute; inset: 0; }
  #transition.in .pillar { transform: translateY(0); }
  #transition .half { position: absolute; inset: 0; transition: transform 0.65s cubic-bezier(.7,0,.3,1); }
  #transition .half.top { top: 0; }
  #transition .half.bot { bottom: 0; }
  #transition .half.top { transform: translateY(-100%); }
  #transition .half.bot { transform: translateY(100%); }
  #transition.close .half { transition-duration: 0.55s; }
  #transition.close .half.top, #transition.close .half.bot { transform: translateY(0); }
  #transition.open .half.top { transform: translateY(-100%); }
  #transition.open .half.bot { transform: translateY(100%); }
  #transition .seam { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #transition .seam path { fill: none; stroke: rgba(30,36,44,0.7); stroke-width: 2; }

  #transition .face { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: linear-gradient(90deg, #5a6068 0%, #aeb5be 16%, #eef2f6 36%, #fbfcfd 46%, #c4cbd4 62%, #8d949e 82%, #565c64 100%); }
  #transition .half.top .face { top: 0; }
  #transition .half.bot .face { top: 0; }
  #transition .face::before, #transition .face::after { content: ''; position: absolute; left: 0; width: 100%; height: 16px; background: linear-gradient(180deg, rgba(40,46,54,0.55), rgba(255,255,255,0.35) 55%, rgba(40,46,54,0.35)); }
  #transition .face::before { top: 12%; }
  #transition .face::after { bottom: 12%; }
  #transition .orb { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; filter: drop-shadow(0 0 3px #e8eef5) drop-shadow(0 6px 8px rgba(30,36,46,0.4)); transition: transform 0.9s cubic-bezier(.35,0,.65,1), filter 0.9s; }
  #transition.spin .orb { transform: rotate(1080deg); filter: drop-shadow(0 0 22px #ffffff) drop-shadow(0 6px 8px rgba(30,36,46,0.4)); }
  #transition .tt { position: absolute; left: 0; right: 0; top: calc(50% + 140px); text-align: center; font-size: 32px; font-weight: bold; color: #1b2430; letter-spacing: 6px; opacity: 0; transition: opacity 0.3s; text-shadow: 0 0 10px rgba(255,255,255,0.9); }
  #transition.in .tt { opacity: 1; }
  #transition::after { content: ''; position: absolute; inset: 0; background: #fff; opacity: 0; transition: opacity 0.12s; pointer-events: none; }

let player, hazards, particles, startTime, isGameOver, spawnTimer, shakeTime;

let lastPose = -1;

  let t; do { t = Math.floor(Math.random() * 3); } while (t === lastPose);
  lastPose = t;
  player.pose = { type: t, t0: performance.now(), dur: 1300 };
}

function move(dc, dr) {
  if (isGameOver || inMenu || paused || transitioning) return;
  const nc = Math.max(0, Math.min(N - 1, player.c + dc));
  const nr = Math.max(0, Math.min(N - 1, player.r + dr));
  if (nc !== player.c || nr !== player.r) {
    player.c = nc; player.r = nr;
    player.walk += 2;
    player.step = { dc, dr, t0: performance.now() };
    player.pose = null;
    sfxMove();
  }
}

const SWIPE_MIN = 20;
let start = null;
window.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY, t: Date.now() }; });

  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.hypot(dx, dy) < SWIPE_MIN) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
  else move(0, dy > 0 ? 1 : -1);

});

});

  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];

function spawnHazard(horizontal, idx) {

  const t = (Date.now() - startTime) / 1000;
  const v = cell * 0.05 * dir;

    y: horizontal ? (idx + 0.5) * cell : (dir > 0 ? -cell : size + cell),

    specks: Array.from({ length: 40 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.8, size: 0.025 + Math.random() * 0.045, light: Math.random() < 0.45 })),
    cracks: Array.from({ length: 6 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.4, dphi: (Math.random() - 0.5) * 0.9, dlat: (Math.random() - 0.5) * 0.7 })),
    shape: Array.from({ length: 9 }, () => 0.9 + Math.random() * 0.16)
  });
}

const WAVE_PTS = [[0, 115], [10, 113], [20, 105], [30, 93], [40, 80], [50, 55], [60, 30]];
const waveInterval = elapsed => { if (elapsed >= 60) return 30; let k = 1; while (WAVE_PTS[k][0] < elapsed) k++; const a = WAVE_PTS[k - 1], b = WAVE_PTS[k]; return Math.round(a[1] + (b[1] - a[1]) * (elapsed - a[0]) / (b[0] - a[0])); };
function spawnWave(elapsed) {
  if (level === 'missile') { spawnMissiles(elapsed); return; }
  if (level === 'balloon') { spawnBalloons(elapsed); return; }
  const count = Math.min(8, 2 + Math.floor(elapsed / 10));
  const used = new Set();
  let rows = 0, cols = 0, tries = 0, spawned = 0;
  hazards.forEach(h => {
    if (h.laser ? h.phase === 'fire' : h.warn <= 0) return;
    const key = (h.horizontal ? 'h' : 'v') + h.idx;
    if (used.has(key)) return;
    used.add(key);
    if (h.horizontal) rows++; else cols++;
  });
  while (spawned < count && tries++ < 50) {
    const horizontal = Math.random() < 0.5;
    if (horizontal ? rows >= 4 : cols >= 4) continue;
    const idx = Math.floor(Math.random() * N);
    const key = (horizontal ? 'h' : 'v') + idx;
    if (used.has(key)) continue;
    used.add(key);
    if (horizontal) rows++; else cols++;
    spawnHazard(horizontal, idx);
    spawned++;
  }
}

function createExplosion(x, y) {

    const a = Math.random() * Math.PI * 2, s = Math.random() * 8 + 2;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: Math.random() * 6 + 2, life: 1 });

}

const bg = document.createElement('canvas');
bg.width = canvas.width;
bg.height = canvas.height;
(function () {
  const b = bg.getContext('2d');
  b.fillStyle = '#a98259';
  b.fillRect(0, 0, bg.width, bg.height);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * bg.width, y = Math.random() * bg.height, s = Math.random() * 4 + 1;

    b.fillStyle = 'rgba(120,100,85,0.55)';
    b.beginPath(); b.arc(x, y, s, 0, Math.PI * 2); b.fill();
    b.fillStyle = 'rgba(40,25,15,0.3)';
    b.beginPath(); b.arc(x + 1, y + 1.2, s * 0.8, 0, Math.PI * 2); b.fill();
  }
})();

const bests = { rock: 0, laser: 0, missile: 0, balloon: 0 };
try {
  bests.rock = parseFloat(localStorage.getItem('mrOopsBest')) || 0;
  bests.laser = parseFloat(localStorage.getItem('mrOopsBestLaser')) || 0;

} catch (e) {}
let level = 'rock';
const bestEl = document.getElementById('best');
const fmtBest = v => v > 0 ? v.toFixed(2) + ' 秒' : '--';
function showBest() {

    ? '最佳紀錄\n石頭關卡　' + fmtBest(bests.rock) + '\n激光關卡　' + fmtBest(bests.laser) + '\n飛彈關卡　' + fmtBest(bests.missile) + '\n水球關卡　' + fmtBest(bests.balloon)

let bestRef = null;
(async () => {
  try {
    if (!window.claude) return;

function saveBestRemote() { if (bestRef) bestRef.set({ value: bests.rock, laser: bests.laser, missile: bests.missile, balloon: bests.balloon }).catch(() => {}); }
let nextWave = 60;
const RIM = cell * 0.45;
const ZDROP = cell * 0.6;
const GRAV = cell * 0.018;
function terrainDepth(x, y) {
  const a = x, b = size - x, c = y, d = size - y;
  if (a <= 0 || b <= 0 || c <= 0 || d <= 0) return 0;
  const e = Math.pow(Math.pow(a, -4) + Math.pow(b, -4) + Math.pow(c, -4) + Math.pow(d, -4), -0.25);
  if (e >= RIM) return 1;
  const t = e / RIM;
  return t * t * (3 - 2 * t);
}
function applyTerrainShading(b) {
  const x0 = Math.round(pad), y0 = Math.round(pad);
  const img = b.getImageData(x0, y0, size, size), px = img.data;
  const K2 = RIM * 0.9, SW = cell * 0.9;
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const dep = terrainDepth(i, j);
      const gx = (terrainDepth(i + 1, j) - terrainDepth(i - 1, j)) / 2;
      const gy = (terrainDepth(i, j + 1) - terrainDepth(i, j - 1)) / 2;
      const lit = -(gx + gy) * 0.5 * K2;
      const sh = Math.max(0, 1 - i / SW, 1 - j / SW);
      const f = Math.max(0.25, 1 + lit * 1.1) * (1 - 0.12 * dep) * (1 - 0.5 * sh);
      const k = (j * size + i) * 4;
      px[k] = Math.min(255, px[k] * f);
      px[k + 1] = Math.min(255, px[k + 1] * f);
      px[k + 2] = Math.min(255, px[k + 2] * f);
    }
  }
  b.putImageData(img, x0, y0);
}
function updateFall(h, dt) {
  const u = h.horizontal ? h.x : h.y;
  if (!h.entered) {
    h.air = false;
    if (h.dir > 0 ? u >= 0 : u <= size) { h.entered = true; h.vz = 0; } else return;
  }
  const over = h.dir > 0 ? u - size : -u;
  if (over > 0) { h.air = false; h.sm = 1; h.z = Math.min(ZDROP, (ZDROP * over) / (cell * 0.5)); return; }

    h.air = true;

    h.air = false;
    h.sm += (1 - h.sm) * Math.min(1, 0.2 * dt);

}
function landDust(h) {

    const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.6 + 0.4;
    particles.push({ x: h.x + Math.cos(a) * h.r * 0.6, y: h.y + Math.sin(a) * h.r * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.3, size: Math.random() * 7 + 4, life: 0.9, dust: true });
  }
}

const bg2 = document.createElement('canvas');
bg2.width = canvas.width;
bg2.height = canvas.height;
function build_bg2() {
  const b = bg2.getContext('2d');
  const W = bg2.width, H = bg2.height;
  const rnd = (a, c) => a + Math.random() * (c - a);
  b.fillStyle = '#4f8a3a';
  b.fillRect(0, 0, W, H);
  for (let i = 0; i < 3500; i++) {
    const x = rnd(0, W), y = rnd(0, H);
    b.strokeStyle = Math.random() < 0.5 ? 'rgba(30,90,30,0.5)' : 'rgba(150,205,85,0.45)';
    b.lineWidth = 1.2;
    b.beginPath(); b.moveTo(x, y); b.lineTo(x + rnd(-2, 2), y - rnd(2, 8)); b.stroke();
  }
  b.save();
  b.beginPath(); b.rect(pad, pad, size, size); b.clip();
  b.drawImage(bg, 0, 0);
  for (let i = 0; i < 40; i++) {
    const x = pad + rnd(0, size), y = pad + rnd(0, size), r = cell * rnd(0.6, 1.8);
    const g = b.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, Math.random() < 0.5 ? 'rgba(40,22,10,0.28)' : 'rgba(205,155,100,0.2)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(x - r, y - r, 2 * r, 2 * r);
  }

  if (isNew) {
    bests[level] = secs;
    try { localStorage.setItem(level === 'laser' ? 'mrOopsBestLaser' : level === 'missile' ? 'mrOopsBestMissile' : level === 'balloon' ? 'mrOopsBestBalloon' : 'mrOopsBest', String(secs)); } catch (e) {}

let lastT = performance.now();
let fpsFrames = 0, fpsLast = performance.now();
const fpsEl = document.getElementById('fps');

  lastT = nowT;
  fpsFrames++;
  if (nowT - fpsLast >= 500) {
    fpsEl.innerText = Math.round((fpsFrames * 1000) / (nowT - fpsLast)) + ' FPS';
    fpsFrames = 0; fpsLast = nowT;
  }
  if (inMenu || paused) { requestAnimationFrame(loop); return; }
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
    shakeTime--;
  }
  ctx.translate(pad, pad);
  ctx.clearRect(-pad - 20, -pad - 20, size + 2 * pad + 40, size + 2 * pad + 40);
  ctx.drawImage(level === 'laser' ? bgVault : level === 'missile' ? bgSea : level === 'balloon' ? bgPark : bg2, -pad, -pad);
  drawGrid();
  if (level === 'missile') drawCraters();

  if (!isGameOver) {
    if (transitioning) { startTime = Date.now(); spawnTimer = 0; }
    const elapsed = ((Date.now() - startTime) / 1000);
    ui.innerText = elapsed.toFixed(2) + ' 秒';

    spawnTimer += dt;
    if (spawnTimer >= nextWave) { spawnWave(elapsed); spawnTimer = 0; nextWave = waveInterval(elapsed) * (0.6 + Math.random() * 0.8); }

    const tx = (player.c + 0.5) * cell, ty = (player.r + 0.5) * cell;
    const lerp = Math.min(1, 0.35 * dt);
    player.px += (tx - player.px) * lerp;
    player.py += (ty - player.py) * lerp;
  }

  updateSquash();
  if (player.zap && isGameOver && Math.random() < 0.35) {
    particles.push({ x: player.px + (Math.random() - 0.5) * cell * 0.3, y: player.py - cell * 0.2, vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 0.5, size: 4 + Math.random() * 5, life: 0.8, dust: true });
  }
  drawStickman(player, player.sq || 0);

  for (let i = hazards.length - 1; i >= 0; i--) {

    if (h.missile) { updateMissile(h, dt, i); continue; }
    if (h.balloon) { updateBalloon(h, dt, i); continue; }

        const by = h.horizontal ? h.y + h.r * 0.8 : h.y - Math.sign(h.v) * h.r * 0.8;

function updateRollSound() {
